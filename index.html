<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>语言学习助手</title>
<meta name="theme-color" content="#F7F3EC">
<meta name="description" content="你的英语私人导师，住在手机里，随时能聊。">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">

<!-- iOS 独立窗口支持 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="语言学习助手">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="icon" href="icons/icon-192.png">

<!-- DESIGN.md 字体：Source Serif 4（英文主体）/ Inter（UI/中文）/ JetBrains Mono（元数据） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="app">
  <main id="page-outlet" class="page-outlet">
    <!-- 当前路由对应的页面内容由 app.js 渲染到这里 -->
  </main>

  <nav class="tab-bar" id="tab-bar" role="tablist" aria-label="主导航">
    <button class="tab-item" data-route="home" role="tab" aria-selected="true">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 21V10l8-6 8 6v11h-6v-7h-4v7H4z"/></svg></span>
      <span class="tab-label">首页</span>
    </button>
    <button class="tab-item" data-route="vocab" role="tab" aria-selected="false">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg></span>
      <span class="tab-label">词库</span>
    </button>
    <button class="tab-item" data-route="conversation" role="tab" aria-selected="false">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6h16v10H8l-4 4V6z"/></svg></span>
      <span class="tab-label">对话</span>
    </button>
    <button class="tab-item" data-route="grammar" role="tab" aria-selected="false">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5h16M4 10h10M4 15h16M4 20h10"/></svg></span>
      <span class="tab-label">语法</span>
    </button>
    <button class="tab-item" data-route="profile" role="tab" aria-selected="false">
      <span class="tab-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg></span>
      <span class="tab-label">我</span>
    </button>
  </nav>
</div>

<script src="data/vocab-data.js"></script>
<script src="js/home.js"></script>
<script src="js/vocab.js"></script>
<script src="js/conversation.js"></script>
<script src="js/grammar-data.js"></script>
<script src="js/grammar.js"></script>
<script src="js/profile.js"></script>
<script src="js/app.js"></script>
</body>
</html>
