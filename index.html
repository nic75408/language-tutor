<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>语言学习助手</title>
<meta name="theme-color" content="#3b82f6">
<meta name="description" content="你的英语私人导师，住在手机里，随时能聊。">

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest">

<!-- iOS 独立窗口支持 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="语言学习助手">
<link rel="apple-touch-icon" href="icons/icon-192.png">

<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="app">
  <main id="page-outlet" class="page-outlet">
    <!-- 当前路由对应的页面内容由 app.js 渲染到这里 -->
  </main>

  <nav class="tab-bar" id="tab-bar" role="tablist" aria-label="主导航">
    <button class="tab-item" data-route="home" role="tab" aria-selected="true">
      <span class="tab-icon">📊</span>
      <span class="tab-label">首页</span>
    </button>
    <button class="tab-item" data-route="vocab" role="tab" aria-selected="false">
      <span class="tab-icon">📖</span>
      <span class="tab-label">词库</span>
    </button>
    <button class="tab-item" data-route="conversation" role="tab" aria-selected="false">
      <span class="tab-icon">💬</span>
      <span class="tab-label">对话</span>
    </button>
    <button class="tab-item" data-route="grammar" role="tab" aria-selected="false">
      <span class="tab-icon">📐</span>
      <span class="tab-label">语法</span>
    </button>
    <button class="tab-item" data-route="profile" role="tab" aria-selected="false">
      <span class="tab-icon">👤</span>
      <span class="tab-label">我</span>
    </button>
  </nav>
</div>

<script src="data/vocab-data.js"></script>
<script src="js/home.js"></script>
<script src="js/vocab.js"></script>
<script src="js/conversation.js"></script>
<script src="js/grammar-data.js"></script>
<script src="js/grammar.js"></script>
<script src="js/profile.js"></script>
<script src="js/app.js"></script>
</body>
</html>
